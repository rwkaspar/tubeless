<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tubeless</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="head__brand">
        <span class="head__mark"></span>
        <span class="head__name">Tubeless</span>
      </div>
      <label class="master">
        <input type="checkbox" id="master" data-i18n-aria-label="masterLabel" />
        <span class="master__track"><span class="master__knob"></span></span>
      </label>
    </header>

    <!-- Alles zwischen Kopf und Fuß scrollt gemeinsam -->
    <div id="scroll" class="scroll">
      <form class="search" id="search-form">
        <input
          type="search"
          id="search-input"
          data-i18n-placeholder="searchPlaceholder"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit" data-i18n-aria-label="searchSubmit">↵</button>
      </form>

      <div class="presets">
        <button type="button" data-preset="custom" data-i18n="presetCustom"></button>
        <button type="button" data-preset="fokus" data-i18n="presetFocus"></button>
        <button type="button" data-preset="aus" data-i18n="presetNone"></button>
    </div>

    <button type="button" id="custom-save" class="custom-save" hidden></button>

    <section class="timing">
      <!-- Kurzpause: setzt alles aus, läuft von selbst ab -->
      <div class="timing__row" id="break-idle">
        <span class="timing__label" data-i18n="breakLabel"></span>
        <div class="timing__controls">
          <button type="button" class="break-btn" data-minutes="5"></button>
          <button type="button" class="break-btn" data-minutes="15"></button>
          <button type="button" class="break-btn" data-minutes="30"></button>
          <input
            type="number"
            id="break-custom"
            class="break-custom"
            min="1"
            max="720"
            inputmode="numeric"
            data-i18n-placeholder="breakCustom"
            data-i18n-aria-label="breakCustomLabel"
          />
        </div>
      </div>
      <div class="timing__row timing__row--running" id="break-running" hidden>
        <span id="break-remaining" class="timing__running"></span>
        <button type="button" id="break-end" data-i18n="breakEnd"></button>
      </div>

      <!-- Bilanz: nur sinnvoll, solange eine Fokuszeit gesetzt ist -->
      <div class="timing__row timing__usage" id="usage-row" hidden>
        <span class="timing__label">
          <span data-i18n="usageLabel"></span>:
          <b id="usage-value"></b>
        </span>
        <span class="timing__hint" data-i18n="usageHint"></span>
      </div>

      <!-- Fokuszeit: außerhalb des Fensters filtert Tubeless nicht -->
      <div class="timing__row">
        <label class="timing__toggle">
          <input type="checkbox" id="schedule-enabled" />
          <span data-i18n="scheduleLabel"></span>
        </label>
        <div class="timing__controls">
          <input type="time" id="schedule-start" data-i18n-aria-label="scheduleStart" />
          <span class="timing__dash" aria-hidden="true">–</span>
          <input type="time" id="schedule-end" data-i18n-aria-label="scheduleEnd" />
        </div>
      </div>
    </section>

    <section id="rate" class="rate" hidden>
      <p class="rate__text" data-i18n="rateText"></p>
      <div class="rate__actions">
        <button type="button" id="rate-yes" data-i18n="rateAction"></button>
        <button type="button" id="rate-later" data-i18n="rateLater"></button>
      </div>
    </section>

    <main id="groups" class="groups"></main>
    </div>

    <footer class="foot">
      <span id="count">–</span>
      <button type="button" id="reset" data-i18n="footerReset"></button>
    </footer>

    <aside class="colophon">
      <span data-i18n="colophonBy"></span>
      <a href="https://neotactiq.ai" target="_blank" rel="noopener noreferrer">NeoTactIQ</a>
      <span class="colophon__sep" aria-hidden="true">·</span>
      <a href="https://ko-fi.com/neotactiq" target="_blank" rel="noopener noreferrer">Ko-fi</a>
      <span class="colophon__sep" aria-hidden="true">·</span>
      <a href="https://www.patreon.com/c/neotactiq" target="_blank" rel="noopener noreferrer">Patreon</a>
      <span class="colophon__sep" aria-hidden="true">·</span>
      <a href="#" id="rate-link" data-i18n="footerRate"></a>
    </aside>

    <script src="../src/i18n.js"></script>
    <script src="../src/features.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
